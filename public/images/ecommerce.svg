<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3f5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#296297;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000044"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="0"/>

  <!-- Decorative circles -->
  <circle cx="370" cy="30" r="60" fill="#ffffff" opacity="0.04"/>
  <circle cx="30" cy="270" r="80" fill="#ffffff" opacity="0.04"/>
  <circle cx="350" cy="260" r="40" fill="#4fc3f7" opacity="0.07"/>

  <!-- Grid dots -->
  <g opacity="0.08">
    <circle cx="50" cy="50" r="2" fill="white"/>
    <circle cx="90" cy="50" r="2" fill="white"/>
    <circle cx="130" cy="50" r="2" fill="white"/>
    <circle cx="50" cy="90" r="2" fill="white"/>
    <circle cx="90" cy="90" r="2" fill="white"/>
    <circle cx="130" cy="90" r="2" fill="white"/>
    <circle cx="50" cy="130" r="2" fill="white"/>
    <circle cx="90" cy="130" r="2" fill="white"/>
    <circle cx="130" cy="130" r="2" fill="white"/>
  </g>

  <!-- Shopping bag main shape -->
  <g transform="translate(200, 145)" filter="url(#shadow)">
    <!-- Bag body -->
    <rect x="-55" y="-10" width="110" height="85" rx="10" fill="url(#cardGrad)" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="-55" y="-10" width="110" height="85" rx="10" fill="#ffffff" opacity="0.12"/>

    <!-- Bag handle -->
    <path d="M -25 -10 L -25 -32 Q -25 -52 0 -52 Q 25 -52 25 -32 L 25 -10" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9"/>

    <!-- Shine on handle -->
    <path d="M -22 -10 L -22 -32 Q -22 -49 0 -49" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Products inside bag -->
    <rect x="-38" y="12" width="34" height="28" rx="5" fill="#4fc3f7" opacity="0.85"/>
    <rect x="-38" y="12" width="34" height="8" rx="5" fill="#29b6f6" opacity="0.9"/>
    <rect x="4" y="12" width="34" height="28" rx="5" fill="#81d4fa" opacity="0.75"/>
    <rect x="4" y="12" width="34" height="8" rx="5" fill="#4fc3f7" opacity="0.85"/>

    <!-- Small price tag -->
    <rect x="-38" y="52" width="20" height="10" rx="3" fill="#ffd54f" opacity="0.9"/>
    <line x1="-34" y1="56" x2="-22" y2="56" stroke="#f57f17" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-34" y1="59" x2="-26" y2="59" stroke="#f57f17" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating coins -->
  <circle cx="135" cy="110" r="14" fill="#ffd54f" opacity="0.9" filter="url(#glow)"/>
  <text x="135" y="115" text-anchor="middle" font-size="14" fill="#e65100" font-weight="bold" font-family="Arial">€</text>

  <circle cx="280" cy="80" r="10" fill="#ffd54f" opacity="0.7"/>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold" font-family="Arial">€</text>

  <circle cx="310" cy="195" r="8" fill="#ffd54f" opacity="0.6"/>
  <text x="310" y="199" text-anchor="middle" font-size="8" fill="#e65100" font-weight="bold" font-family="Arial">€</text>

  <!-- Stars / sparkles -->
  <g opacity="0.6" fill="#ffffff">
    <polygon points="155,65 157,72 164,72 158,76 161,83 155,79 149,83 152,76 146,72 153,72" transform="scale(0.5) translate(155,65)"/>
    <circle cx="320" cy="130" r="2.5" fill="white" opacity="0.7"/>
    <circle cx="100" cy="190" r="2" fill="white" opacity="0.5"/>
    <circle cx="340" cy="65" r="3" fill="#ffd54f" opacity="0.6"/>
  </g>

  <!-- Bottom label -->
  <rect x="110" y="255" width="180" height="28" rx="14" fill="url(#btnGrad)" opacity="0.9"/>
  <text x="200" y="274" text-anchor="middle" font-size="12" fill="white" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="1.5">E-COMMERCE</text>

  <!-- Symfony badge -->
  <rect x="20" y="255" width="75" height="25" rx="6" fill="#ffffff" opacity="0.1" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="57" y="272" text-anchor="middle" font-size="10" fill="white" font-family="Arial, sans-serif" opacity="0.8">Symfony</text>

  <!-- PHP badge -->
  <rect x="305" y="255" width="75" height="25" rx="6" fill="#ffffff" opacity="0.1" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="342" y="272" text-anchor="middle" font-size="10" fill="white" font-family="Arial, sans-serif" opacity="0.8">PHP / SQL</text>
</svg>
